<!DOCTYPE html>
<html>
<head>
    <title>Calcular Hash</title>
</head>
<body>
<script>
async function calcularHash() {
    const senha = "eletroif";
    const data = new TextEncoder().encode(senha);
    const buf = await crypto.subtle.digest('SHA-256', data);
    const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    console.log('Hash de "eletroif":', hash);
    document.body.innerHTML = 'Hash de "eletroif": ' + hash;
}
calcularHash();
</script>
</body>
</html>
