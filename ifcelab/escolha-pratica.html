<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha Prática - IFCE LAB</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/escolha-pratica.css">
</head>
<body>
    <header class="header" id="mainHeader">
        <div class="logo">IFCE<span>Lab</span></div>
        <nav class="nav">
            <a href="#" class="active">Início</a>
            <a href="#">Práticas</a>
            <a href="#">Resultados</a>
        </nav>
        <div class="user-info">
            <span style="font-size: 14px; color: var(--text-muted);">Aluno</span>
            <div class="user-badge">A</div>
        </div>
    </header>

    <div class="hero">
        <img src="pra_1.jpeg" alt="Laboratório de eletrônica">
        <div class="hero-overlay"></div>
        <div class="hero-overlay-bottom"></div>
        <div class="hero-content">
            <p class="hero-subtitle">Sistema de Laboratório · IFCE</p>
            <h1 class="hero-title">Escolha sua<br>Prática</h1>
            <p class="hero-description">Selecione uma das práticas disponíveis para iniciar seu trabalho no laboratório.</p>
            <div class="hero-buttons">
                <button class="btn btn-secondary">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                    Mais informações
                </button>
            </div>
        </div>
    </div>

    <div class="practices-section">
        <div class="groq-key-box">
            <h2>Chave Groq do grupo</h2>
            <p>Cada grupo usa a propria chave. Crie em <a href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer">console.groq.com/keys</a> e cole abaixo.</p>
            <div class="groq-key-row">
                <input type="password" id="groqApiKeyGrupo" placeholder="gsk_..." autocomplete="off">
                <button type="button" class="btn" onclick="salvarChaveGroqTela()">Salvar chave</button>
            </div>
            <p id="groqKeyStatus" class="groq-key-status"></p>
        </div>
        <h2 class="practices-title">Práticas Disponíveis</h2>
        <div class="grid-cards" id="gridAluno"></div>
    </div>

    <div class="logout-section">
        <button onclick="sairConta()" class="btn-logout">Encerrar Sessão</button>
    </div>

    <script>
        // Header scroll effect
        window.addEventListener('scroll', function() {
            const header = document.getElementById('mainHeader');
            if (window.scrollY > 60) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>

    <script src="script.js?v=6"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Preencher o grid de práticas do aluno
            const gridAluno = document.getElementById("gridAluno");
            if (gridAluno && typeof modulosPraticas !== 'undefined') {
                let alunoHtml = "";
                modulosPraticas.forEach(m => {
                    alunoHtml += `<div class="module-card" onclick="abrirAtividade('${m.id}')"><div class="module-img" style="background-image: url('${m.img}');"></div><div class="module-title">${m.titulo}</div></div>`;
                });
                gridAluno.innerHTML = alunoHtml;
            }
            const status = document.getElementById('groqKeyStatus');
            if (status && (sessionStorage.getItem('groqApiKey') || localStorage.getItem('groqApiKey'))) {
                status.textContent = 'Chave Groq deste grupo ja esta salva neste aparelho.';
            }
        });
    </script>
</body>
</html>
